<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speed+ 管理後台</title>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "three-mesh-bvh": "/vendor/three-mesh-bvh/build/index.module.js"
} }
</script>
<style>
:root{--bg:#0f1218;--panel:#171c26;--line:#262d3b;--fg:#e6e9f0;--dim:#8b95a8;--acc:#ff6a2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Noto Sans TC",sans-serif;height:100vh;display:flex;overflow:hidden}
#side{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
#stage{flex:1;position:relative;min-width:0}
canvas{display:block}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%}
h3{margin:14px 0 6px;font-size:12px;letter-spacing:.1em;color:var(--dim)}
button,select,input{font:inherit;color:var(--fg);background:#222a38;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.row label{width:96px;color:var(--dim);flex-shrink:0}
.row input[type=number]{width:70px}.row input[type=range]{flex:1;min-width:80px;padding:0}
.row input[type=text]{flex:1;min-width:0}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}
#login form{background:var(--panel);padding:24px;border-radius:12px;display:flex;flex-direction:column;gap:10px;width:300px}
#toast{position:fixed;right:16px;bottom:16px;background:#222a38;border:1px solid var(--acc);padding:8px 14px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
.hint{color:var(--dim);font-size:12px;margin:4px 0}
.list button{width:100%;text-align:left;margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
#tip{position:absolute;left:12px;top:10px;background:#000a;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;max-width:60%}
</style>
</head>
<body>
<div id="login"><form id="lf"><b style="font-size:18px">Speed+ 管理後台</b><input type="password" id="pw" placeholder="管理員密碼" autofocus><button class="pri">登入</button><div class="hint" id="lerr"></div></form></div>
<div id="side">
  <div class="tabs"><button data-k="car" class="on">賽車</button><button data-k="map">地圖</button><button data-k="character">人物</button><button data-k="rec">紀錄</button></div>
  <div class="list" id="list"></div>
  <div class="row"><button id="up">上傳 GLB…</button><button id="rescan">重新掃描</button><input type="file" id="file" accept=".glb" hidden></div>
  <div id="panel"></div>
</div>
<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="tip"></div></div>
<div id="toast"></div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
